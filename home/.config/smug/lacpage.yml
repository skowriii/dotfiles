session: lacpage

root: /personal/Projects/Laccaria/laccaria-page

before_start:
  - sudo systemctl start docker
  - npm run db:up -w server

stop:
  - npm run db:down -w server
  - sudo systemctl stop docker

windows:
  - name: editor
    selected: true
    layout: main-vertical
    commands:
      - $EDITOR .

  - name: shell
    layout: main-vertical
    commands:
      - task project:laccaria

  - name: atac
    layout: main-vertical
    commands:
      - atac

  - name: server
    layout: tiled
    commands:
      - steam-run npm run dev -w server
    panes:
      - type: horizontal
        commands:
          - steam-run npm run api:dev -w server

  - name: lazygit
    layout: main-vertical
    commands:
      - lazygit
